<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PITLANE — Formula 1 Standings &amp; Race Timing</title>
  <meta name="description" content="Formula 1 championship standings, race calendar, and official Grand Prix classification.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&display=swap" rel="stylesheet">
  <style>
    /*
     * PITLANE — Race Control & Timing Monitor Aesthetic
     * Deep matte charcoal canvas, sharp 1px grid rules, tabular precision.
     * Team liveries applied strictly as 3px row stripes. Zero glows, zero shadows.
     */
    :root {
      --bg-canvas: #1E1E24;
      --bg-surface: #444140;
      --bg-subtle: #444140;
      --bg-hover: #1E1E24;
      --text-main: #F7EBE8;
      --text-dim: rgba(247, 235, 232, 0.72);
      --text-faint: rgba(247, 235, 232, 0.5);
      --border: #444140;
      --border-strong: #444140;
      --red: #E54B4B;
      --accent: #47E5BC;
      
      --font-display: 'Barlow Condensed', -apple-system, sans-serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Tabular numeric alignment for all times, points, and gaps */
    .num, td.num, th.num, .tabular {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    /* Keyboard accessibility */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Header & Navigation */
    header {
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-canvas);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      gap: 16px;
    }

    .brand-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--text-main);
      line-height: 1;
      text-decoration: none;
    }

    .brand-meta {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .brand-meta {
        display: none;
      }
    }

    nav[role="tablist"] {
      display: flex;
      align-items: stretch;
      height: 100%;
      gap: 4px;
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      padding: 0 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      position: relative;
      transition: color 0.15s ease;
      white-space: nowrap;
    }

    .nav-tab:hover {
      color: var(--text-main);
    }

    .nav-tab[aria-selected="true"] {
      color: var(--text-main);
      font-weight: 600;
    }

    .nav-tab[aria-selected="true"]::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 8px;
      right: 8px;
      height: 2px;
      background-color: var(--red);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* Asymmetric Top Grid: The Title Fight Headline (dominant element) */
    .fight-banner {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    @media (min-width: 840px) {
      .fight-banner {
        grid-template-columns: 7fr 4fr;
        align-items: end;
      }
    }

    .fight-lead {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-eyebrow {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .fight-headline {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    @media (min-width: 640px) {
      .fight-headline {
        font-size: 40px;
      }
    }

    .fight-context {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* Scaled Points Comparison Bar */
    .bar-comparison {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 12px 14px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      gap: 12px;
    }

    .bar-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .bar-track {
      width: 100%;
      height: 4px;
      background-color: var(--bg-canvas);
      overflow: hidden;
      margin-top: 2px;
    }

    .bar-fill {
      height: 100%;
      background-color: var(--text-main);
    }

    .bar-fill.p2 {
      background-color: var(--text-faint);
    }

    /* Data Tables: Dense, Aligned, Utilitarian */
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      background-color: var(--bg-surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 580px;
    }

    thead th {
      background-color: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      padding: 8px 12px;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: background-color 0.1s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: var(--bg-hover);
    }

    tbody td {
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text-main);
      white-space: nowrap;
      vertical-align: middle;
    }

    /* Team stripe on row edge */
    .td-driver, .td-team {
      position: relative;
    }

    .team-stripe {
      display: inline-block;
      width: 3px;
      height: 14px;
      margin-right: 8px;
      vertical-align: -2px;
    }

    .driver-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .driver-code {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: 6px;
    }

    .driver-num {
      font-size: 11px;
      color: var(--text-faint);
      margin-left: 4px;
    }

    .secondary-dim {
      color: var(--text-dim);
      font-size: 12px;
    }

    .pos-col {
      width: 44px;
      color: var(--text-dim);
      font-weight: 500;
    }

    tbody tr:first-child .pos-col {
      color: var(--text-main);
      font-weight: 700;
    }

    .gap-col {
      color: var(--text-dim);
      font-size: 12px;
    }

    .pts-col {
      font-weight: 600;
      color: var(--text-main);
    }

    /* View Controls / Selector Bar */
    .view-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .view-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .round-select {
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 10px;
      font-family: var(--font-body);
      font-size: 12px;
      cursor: pointer;
    }

    .round-select:focus-visible {
      outline: 2px solid var(--text-main);
    }

    /* Winner indicator tag (simple text, no pill) */
    .fl-marker {
      font-size: 10px;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 1px 4px;
      margin-left: 6px;
      font-weight: 600;
    }

    /* States: Loading & Error */
    .state-panel {
      padding: 36px 16px;
      text-align: center;
      color: var(--text-dim);
      border: 1px solid var(--border);
      background-color: var(--bg-surface);
    }

    .state-panel.error {
      border-color: var(--red);
    }

    .state-panel.error .error-title {
      color: var(--red);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .retry-btn {
      margin-top: 12px;
      background-color: var(--red);
      color: var(--text-main);
      border: 1px solid var(--red);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .retry-btn:hover {
      filter: brightness(1.1);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 16px;
      font-size: 11px;
      color: var(--text-faint);
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
    }

    footer a {
      color: var(--text-dim);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header>
    <div class="header-inner">
      <div class="brand-wrap">
        <a href="#standings" class="brand-title">PITLANE</a>
        <span class="brand-meta" id="header-season-meta">FIA Formula 1 World Championship</span>
      </div>

      <nav role="tablist" aria-label="Championship Views">
        <button role="tab" class="nav-tab" id="tab-standings" data-tab="standings" aria-selected="true" aria-controls="panel-content">Standings</button>
        <button role="tab" class="nav-tab" id="tab-constructors" data-tab="constructors" aria-selected="false" aria-controls="panel-content">Constructors</button>
        <button role="tab" class="nav-tab" id="tab-calendar" data-tab="calendar" aria-selected="false" aria-controls="panel-content">Calendar</button>
        <button role="tab" class="nav-tab" id="tab-results" data-tab="results" aria-selected="false" aria-controls="panel-content">Results</button>
      </nav>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="panel-content" tabindex="-1">
    <div id="loading" class="state-panel">
      Loading championship telemetry...
    </div>
    <div id="error" class="state-panel error" style="display: none;">
      <div class="error-title">Telemetry feed unavailable</div>
      <div id="error-message">Could not connect to the Jolpica F1 API.</div>
      <button class="retry-btn" onclick="initApp(true)">Retry Request</button>
    </div>
    <div id="view-container" style="display: none;"></div>
  </main>

  <!-- Footer -->
  <footer>
    <span>Data provided by Jolpica (Ergast-compatible) F1 API</span>
    <span>Pitlane Live Timing &amp; Standings Terminal</span>
  </footer>

  <script>
    /**
     * PITLANE — Vanilla JS Client Architecture
     * Real-time Jolpica API integration, URL hash routing, responsive tables.
     */
    const API_BASE = 'https://api.jolpi.ca/ergast/f1/current';

    // F1 Constructor liveries for 3px table row stripes
    const TEAM_COLORS = {
      mercedes: '#27F4D2',
      ferrari: '#E8002D',
      mclaren: '#FF8000',
      red_bull: '#3671C6',
      rb: '#6692FF',
      aston_martin: '#229971',
      alpine: '#FF87BC',
      williams: '#64C4FF',
      haas: '#B6BABD',
      audi: '#C0392B',
      cadillac: '#D1D5DB'
    };

    function getTeamColor(id) {
      return TEAM_COLORS[id] || '#47E5BC';
    }

    // Application Data Cache
    const store = {
      season: null,
      driverStandings: null,
      constructorStandings: null,
      calendar: null,
      latestResults: null,
      selectedResultsRound: null,
      roundResultsCache: {},
      activeTab: 'standings'
    };

    // DOM References
    const dom = {
      loading: document.getElementById('loading'),
      error: document.getElementById('error'),
      errorMsg: document.getElementById('error-message'),
      container: document.getElementById('view-container'),
      seasonMeta: document.getElementById('header-season-meta'),
      tabs: document.querySelectorAll('.nav-tab')
    };

    /**
     * Fetch API data with error handling
     */
    async function fetchJson(endpoint) {
      const url = `${API_BASE}/${endpoint}`;
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${res.statusText}`);
      }
      return await res.json();
    }

    /**
     * Initialize data fetching
     */
    async function initApp(isRetry = false) {
      dom.error.style.display = 'none';
      dom.loading.style.display = 'block';
      dom.container.style.display = 'none';

      try {
        // Fetch standings and calendar concurrently
        const [driversData, constructorsData, calendarData, latestResData] = await Promise.all([
          fetchJson('driverStandings.json'),
          fetchJson('constructorStandings.json'),
          fetchJson('.json'),
          fetchJson('last/results.json')
        ]);

        const dTable = driversData?.MRData?.StandingsTable?.StandingsLists?.[0];
        const cTable = constructorsData?.MRData?.StandingsTable?.StandingsLists?.[0];
        const rTable = calendarData?.MRData?.RaceTable;
        const lastRace = latestResData?.MRData?.RaceTable?.Races?.[0];

        store.season = dTable?.season || rTable?.season || new Date().getFullYear();
        store.driverStandings = dTable?.DriverStandings || [];
        store.constructorStandings = cTable?.ConstructorStandings || [];
        store.calendar = rTable?.Races || [];
        store.latestResults = lastRace || null;
        store.selectedResultsRound = lastRace?.round || null;

        if (store.latestResults) {
          store.roundResultsCache[store.latestResults.round] = store.latestResults;
        }

        dom.seasonMeta.textContent = `${store.season} FIA Formula 1 World Championship`;

        dom.loading.style.display = 'none';
        dom.container.style.display = 'block';

        // Read hash or default to standings
        const hash = window.location.hash.replace('#', '');
        if (['standings', 'constructors', 'calendar', 'results'].includes(hash)) {
          switchTab(hash, false);
        } else {
          switchTab('standings', false);
        }
      } catch (err) {
        console.error('Failed to load F1 data:', err);
        dom.loading.style.display = 'none';
        dom.error.style.display = 'block';
        dom.errorMsg.textContent = err.message || 'Network error fetching live timing telemetry.';
      }
    }

    /**
     * Tab switching & view rendering
     */
    function switchTab(tabName, updateHash = true) {
      store.activeTab = tabName;
      if (updateHash) {
        window.location.hash = tabName;
      }

      dom.tabs.forEach(tab => {
        const isSelected = tab.dataset.tab === tabName;
        tab.setAttribute('aria-selected', isSelected ? 'true' : 'false');
      });

      renderActiveView();
    }

    function renderActiveView() {
      switch (store.activeTab) {
        case 'standings':
          renderStandingsView();
          break;
        case 'constructors':
          renderConstructorsView();
          break;
        case 'calendar':
          renderCalendarView();
          break;
        case 'results':
          renderResultsView();
          break;
        default:
          renderStandingsView();
      }
    }

    /**
     * VIEW 1: Driver Standings (Default)
     * Dominant element: The Championship Title Fight
     */
    function renderStandingsView() {
      const drivers = store.driverStandings;
      if (!drivers.length) {
        dom.container.innerHTML = '<div class="state-panel">No driver standings recorded for this season yet.</div>';
        return;
      }

      const p1 = drivers[0];
      const p2 = drivers[1];
      const p1Pts = parseInt(p1.points, 10);
      const p2Pts = p2 ? parseInt(p2.points, 10) : 0;
      const gap = p1Pts - p2Pts;
      const completedRaces = store.calendar.filter(r => new Date(r.date) < new Date()).length;
      const totalRaces = store.calendar.length || 24;
      const remainingRaces = Math.max(0, totalRaces - completedRaces);

      const p2Pct = p1Pts > 0 ? Math.round((p2Pts / p1Pts) * 100) : 0;

      let fightHtml = '';
      if (p2) {
        fightHtml = `
          <div class="fight-banner">
            <div class="fight-lead">
              <span class="section-eyebrow">Championship Fight</span>
              <h1 class="fight-headline">
                ${p1.Driver.familyName} +${gap} PTS OVER ${p2.Driver.familyName}
              </h1>
              <p class="fight-context">
                ${remainingRaces > 0 ? `${remainingRaces} rounds remaining in the ${store.season} season.` : 'Championship concluded.'}
              </p>
            </div>
            <div class="bar-comparison">
              <div class="bar-row">
                <span class="bar-label">
                  <span class="team-stripe" style="background-color: ${getTeamColor(p1.Constructors[0]?.constructorId)}"></span>
                  P1 ${p1.Driver.givenName} ${p1.Driver.familyName}
                </span>
                <span class="num">${p1Pts} pts</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width: 100%;"></div>
              </div>
              <div class="bar-row" style="margin-top: 6px;">
                <span class="bar-label secondary-dim">
                  <span class="team-stripe" style="background-color: ${getTeamColor(p2.Constructors[0]?.constructorId)}"></span>
                  P2 ${p2.Driver.givenName} ${p2.Driver.familyName}
                </span>
                <span class="num secondary-dim">${p2Pts} pts</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill p2" style="width: ${p2Pct}%;"></div>
              </div>
            </div>
          </div>
        `;
      }

      // Dense Driver Standings Table
      let rowsHtml = drivers.map(item => {
        const team = item.Constructors[0];
        const teamColor = getTeamColor(team?.constructorId);
        const itemPts = parseInt(item.points, 10);
        const gapToLeader = item.position === '1' ? 'Leader' : `-${p1Pts - itemPts}`;

        return `
          <tr>
            <td class="pos-col num">${item.position}</td>
            <td class="td-driver">
              <span class="team-stripe" style="background-color: ${teamColor};" aria-hidden="true"></span>
              <span class="driver-name">${item.Driver.givenName} ${item.Driver.familyName}</span>
              <span class="driver-code">${item.Driver.code || ''}</span>
              ${item.Driver.permanentNumber ? `<span class="driver-num">#${item.Driver.permanentNumber}</span>` : ''}
            </td>
            <td class="secondary-dim">${team?.name || '—'}</td>
            <td class="num secondary-dim">${item.wins}</td>
            <td class="gap-col num">${gapToLeader}</td>
            <td class="pts-col num">${item.points}</td>
          </tr>
        `;
      }).join('');

      dom.container.innerHTML = `
        ${fightHtml}
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="num" style="width: 44px;">Pos</th>
                <th>Driver</th>
                <th>Team</th>
                <th class="num" style="width: 60px;">Wins</th>
                <th class="num" style="width: 110px;">Gap to leader</th>
                <th class="num" style="width: 80px;">Points</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      `;
    }

    /**
     * VIEW 2: Constructor Standings
     */
    function renderConstructorsView() {
      const teams = store.constructorStandings;
      if (!teams.length) {
        dom.container.innerHTML = '<div class="state-panel">No constructor standings recorded yet.</div>';
        return;
      }

      const p1Pts = parseInt(teams[0].points, 10);

      const rowsHtml = teams.map(item => {
        const teamColor = getTeamColor(item.Constructor.constructorId);
        const itemPts = parseInt(item.points, 10);
        const gap = item.position === '1' ? 'Leader' : `-${p1Pts - itemPts}`;

        return `
          <tr>
            <td class="pos-col num">${item.position}</td>
            <td class="td-team">
              <span class="team-stripe" style="background-color: ${teamColor};" aria-hidden="true"></span>
              <span class="driver-name">${item.Constructor.name}</span>
            </td>
            <td class="secondary-dim">${item.Constructor.nationality}</td>
            <td class="num secondary-dim">${item.wins}</td>
            <td class="gap-col num">${gap}</td>
            <td class="pts-col num">${item.points}</td>
          </tr>
        `;
      }).join('');

      dom.container.innerHTML = `
        <div class="view-header">
          <h1 class="view-title">Constructors' Championship</h1>
          <span class="secondary-dim">${teams.length} teams classified</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="num" style="width: 44px;">Pos</th>
                <th>Constructor</th>
                <th>Nationality</th>
                <th class="num" style="width: 60px;">Wins</th>
                <th class="num" style="width: 110px;">Gap to leader</th>
                <th class="num" style="width: 80px;">Points</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      `;
    }

    /**
     * VIEW 3: Calendar
     */
    function renderCalendarView() {
      const races = store.calendar;
      if (!races.length) {
        dom.container.innerHTML = '<div class="state-panel">No calendar schedule available.</div>';
        return;
      }

      const now = new Date();

      const rowsHtml = races.map(race => {
        const raceDate = new Date(`${race.date}T${race.time || '00:00:00Z'}`);
        const isPast = raceDate < now;
        const formattedDate = new Date(race.date).toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric'
        });

        return `
          <tr>
            <td class="pos-col num">${race.round}</td>
            <td>
              <span class="driver-name">${race.raceName}</span>
            </td>
            <td class="secondary-dim">${race.Circuit.circuitName} · ${race.Circuit.Location.locality}, ${race.Circuit.Location.country}</td>
            <td class="tabular secondary-dim">${formattedDate}</td>
            <td class="secondary-dim">
              ${isPast ? '<span style="color: var(--text-dim);">Completed</span>' : '<span style="color: var(--text-main);">Scheduled</span>'}
            </td>
          </tr>
        `;
      }).join('');

      dom.container.innerHTML = `
        <div class="view-header">
          <h1 class="view-title">${store.season} Grand Prix Schedule</h1>
          <span class="secondary-dim">${races.length} rounds scheduled</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="num" style="width: 50px;">Rnd</th>
                <th>Grand Prix</th>
                <th>Circuit &amp; Venue</th>
                <th style="width: 90px;">Date</th>
                <th style="width: 100px;">Status</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>
      `;
    }

    /**
     * VIEW 4: Results (Classification by Round)
     */
    async function renderResultsView() {
      const completedRaces = store.calendar.filter(r => new Date(r.date) < new Date());
      const selectedRound = store.selectedResultsRound || (completedRaces.length ? completedRaces[completedRaces.length - 1].round : '1');

      // Check if we need to fetch specific round results
      if (!store.roundResultsCache[selectedRound]) {
        dom.container.innerHTML = '<div class="state-panel">Loading race classification...</div>';
        try {
          const resData = await fetchJson(`${selectedRound}/results.json`);
          const race = resData?.MRData?.RaceTable?.Races?.[0];
          if (race) {
            store.roundResultsCache[selectedRound] = race;
          }
        } catch (err) {
          dom.container.innerHTML = `<div class="state-panel error">Failed to load Round ${selectedRound} results: ${err.message}</div>`;
          return;
        }
      }

      const race = store.roundResultsCache[selectedRound];
      if (!race || !race.Results || !race.Results.length) {
        dom.container.innerHTML = '<div class="state-panel">No classification data recorded for this round.</div>';
        return;
      }

      const optionsHtml = (completedRaces.length ? completedRaces : store.calendar).map(r => `
        <option value="${r.round}" ${r.round === selectedRound ? 'selected' : ''}>
          Round ${r.round}: ${r.raceName}
        </option>
      `).join('');

      const resultsRows = race.Results.map(res => {
        const teamColor = getTeamColor(res.Constructor?.constructorId);
        const isFL = res.FastestLap?.rank === '1';

        return `
          <tr>
            <td class="pos-col num">${res.positionText}</td>
            <td class="td-driver">
              <span class="team-stripe" style="background-color: ${teamColor};" aria-hidden="true"></span>
              <span class="driver-name">${res.Driver.givenName} ${res.Driver.familyName}</span>
              <span class="driver-code">${res.Driver.code || ''}</span>
              ${isFL ? '<span class="fl-marker" title="Fastest Lap">FL</span>' : ''}
            </td>
            <td class="secondary-dim">${res.Constructor?.name || '—'}</td>
            <td class="num secondary-dim">P${res.grid}</td>
            <td class="num secondary-dim">${res.laps}</td>
            <td class="tabular secondary-dim">${res.Time ? res.Time.time : res.status}</td>
            <td class="pts-col num">${res.points}</td>
          </tr>
        `;
      }).join('');

      dom.container.innerHTML = `
        <div class="view-header">
          <div>
            <h1 class="view-title">${race.raceName}</h1>
            <span class="secondary-dim">${race.Circuit.circuitName} · Round ${race.round} of ${store.calendar.length}</span>
          </div>
          <div>
            <select class="round-select" id="round-switcher" aria-label="Select Grand Prix Round">
              ${optionsHtml}
            </select>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="num" style="width: 44px;">Pos</th>
                <th>Driver</th>
                <th>Team</th>
                <th class="num" style="width: 50px;">Grid</th>
                <th class="num" style="width: 50px;">Laps</th>
                <th>Time / Status</th>
                <th class="num" style="width: 60px;">Points</th>
              </tr>
            </thead>
            <tbody>
              ${resultsRows}
            </tbody>
          </table>
        </div>
      `;

      // Attach event listener to round selector
      const switcher = document.getElementById('round-switcher');
      if (switcher) {
        switcher.addEventListener('change', (e) => {
          store.selectedResultsRound = e.target.value;
          renderResultsView();
        });
      }
    }

    // Keyboard navigation & click handlers for tabs
    dom.tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => {
        switchTab(tab.dataset.tab);
      });

      tab.addEventListener('keydown', (e) => {
        let newIndex = index;
        if (e.key === 'ArrowRight') {
          newIndex = (index + 1) % dom.tabs.length;
        } else if (e.key === 'ArrowLeft') {
          newIndex = (index - 1 + dom.tabs.length) % dom.tabs.length;
        }

        if (newIndex !== index) {
          dom.tabs[newIndex].focus();
          switchTab(dom.tabs[newIndex].dataset.tab);
        }
      });
    });

    // Listen to hash change for back/forward navigation
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '');
      if (['standings', 'constructors', 'calendar', 'results'].includes(hash) && hash !== store.activeTab) {
        switchTab(hash, false);
      }
    });

    // Start application
    initApp();
  </script>
</body>
</html>
